# ── Geospatial ML project configuration ─────────────────────────────────────
# All file paths are relative to the project root (where config.yaml lives).

data:
  weather_data:    "weather_station_data_202406202154.csv"
  station_metadata: "weather_stations_202406211148.csv"
  lakes_shapefile:  "idrografia_laghi.shp"
  rivers_shapefile: "idrografia_lineare.shp"

crs:
  input:  "EPSG:4326"   # WGS-84 geographic CRS used by the raw station data
  target: "EPSG:32632"  # UTM zone 32N – used for metric distance calculations

preprocessing:
  target_col: "temperature"
